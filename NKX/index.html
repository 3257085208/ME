<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QQ.SG — Kaixiang Nie</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --panel: #050505;
      --white: #f4f2ed;
      --muted: #787878;
      --muted-2: #4f4f4f;
      --line: rgba(255, 255, 255, 0.12);
      --split: 58%;
      --radius: 26px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #111;
      color: #fff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      height: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .frame {
      position: relative;
      width: min(1600px, calc(100vw - 28px));
      height: min(920px, calc(100vh - 28px));
      background: var(--panel);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.38),
        inset 0 0 0 1px rgba(255,255,255,0.06);
    }

    /* background split */
    .frame::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          90deg,
          #050505 0,
          #050505 var(--split),
          var(--white) var(--split),
          var(--white) 100%
        );
      z-index: 0;
    }

    /* subtle divider */
    .frame::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: var(--split);
      width: 1px;
      background: rgba(0, 0, 0, 0.08);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.08),
        0 0 24px rgba(0,0,0,0.12);
      z-index: 3;
      pointer-events: none;
    }

    .header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 34px;
      pointer-events: none;
    }

    .logo {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.32em;
      color: #fff;
      pointer-events: auto;
      user-select: none;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 30px;
      pointer-events: auto;
    }

    .nav a {
      color: rgba(0, 0, 0, 0.52);
      text-decoration: none;
      font-size: 10px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      transition: opacity 0.2s ease;
    }

    .nav a:hover {
      opacity: 0.65;
    }

    .nav a.active {
      color: #111;
      font-weight: 600;
    }

    .left {
      position: absolute;
      z-index: 8;
      left: 0;
      top: 0;
      bottom: 0;
      width: 42%;
      display: flex;
      align-items: center;
      padding: 110px 0 90px 54px;
    }

    .left-inner {
      width: min(560px, calc(100% - 44px));
    }

    .eyebrow {
      color: #606060;
      font-size: 10px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      margin-bottom: 22px;
    }

    .signature {
      display: block;
      width: 100%;
      max-width: 520px;
      height: auto;
      overflow: visible;
    }

    .sig {
      fill: none;
      stroke: #f5f2ec;
      stroke-width: 2.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
    }

    .qq {
      margin-top: 18px;
      color: #f0ede7;
      font-size: 12px;
      letter-spacing: 0.42em;
      text-indent: 0.42em;
    }

    .subcopy {
      margin-top: 14px;
      color: #7b7b7b;
      font-size: 10px;
      line-height: 1.85;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .desc {
      margin-top: 22px;
      max-width: 420px;
      color: #5e5e5e;
      font-size: 13px;
      line-height: 1.8;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 30px;
    }

    .btn {
      min-height: 44px;
      padding: 0 18px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
      background: transparent;
      color: #8b8b8b;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn:hover {
      color: #fff;
      border-color: rgba(255,255,255,0.3);
    }

    .btn.primary {
      color: #111;
      background: var(--white);
      border-color: var(--white);
    }

    .btn.primary:hover {
      background: #fff;
    }

    .scroll-hint {
      position: absolute;
      left: 54px;
      bottom: 36px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #626262;
      font-size: 9px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }

    .scroll-hint::before {
      content: "";
      width: 34px;
      height: 1px;
      background: #666;
      display: block;
    }

    .year {
      position: absolute;
      right: 30px;
      bottom: 28px;
      z-index: 10;
      color: rgba(0, 0, 0, 0.42);
      font-size: 9px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    /* portrait area */
    .portrait-wrap {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 63%;
      z-index: 2;
      overflow: hidden;
    }

    .portrait {
      position: absolute;
      right: -4%;
      top: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
      user-select: none;
      pointer-events: none;
    }

    /* left dark fade for better text readability */
    .portrait-wrap .left-fade {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          90deg,
          rgba(5,5,5,0.92) 0%,
          rgba(5,5,5,0.62) 12%,
          rgba(5,5,5,0.18) 22%,
          transparent 32%
        );
      z-index: 2;
      pointer-events: none;
    }

    /* nose / face cleanup */
    .portrait-wrap .face-fix {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      mix-blend-mode: screen;
      opacity: 0.82;
      background:
        radial-gradient(ellipse 11% 8% at 38.8% 49.4%, rgba(255,255,255,0.22), transparent 74%),
        radial-gradient(ellipse 8% 5% at 39.7% 52.3%, rgba(255,255,255,0.18), transparent 76%),
        radial-gradient(ellipse 14% 9% at 37.5% 45.4%, rgba(255,255,255,0.10), transparent 78%);
      filter: blur(4px);
    }

    /* subtle soft shadow under jaw / neck to feel less flat */
    .portrait-wrap .shape-balance {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        radial-gradient(ellipse 24% 16% at 48% 73%, rgba(0,0,0,0.18), transparent 75%);
    }

    /* a faint highlight on the white side for polish */
    .white-glow {
      position: absolute;
      z-index: 1;
      right: 0;
      top: 0;
      bottom: 0;
      width: 28%;
      background:
        radial-gradient(circle at 40% 26%, rgba(255,255,255,0.55), transparent 55%);
      pointer-events: none;
      opacity: 0.35;
    }

    /* responsive fallback */
    @media (max-width: 1100px) {
      .left {
        width: 48%;
        padding-left: 32px;
      }

      .scroll-hint {
        left: 32px;
      }
    }

    @media (max-width: 860px) {
      body {
        overflow: auto;
      }

      .frame {
        width: calc(100vw - 16px);
        height: auto;
        min-height: calc(100vh - 16px);
        margin: 8px 0;
      }

      .frame::before {
        background:
          linear-gradient(
            180deg,
            #050505 0,
            #050505 53%,
            var(--white) 53%,
            var(--white) 100%
          );
      }

      .frame::after {
        display: none;
      }

      .header {
        padding: 20px;
      }

      .nav {
        gap: 14px;
      }

      .nav a {
        font-size: 9px;
      }

      .left {
        position: relative;
        width: 100%;
        padding: 92px 20px 40px;
        align-items: flex-start;
      }

      .left-inner {
        width: 100%;
        max-width: none;
      }

      .portrait-wrap {
        position: relative;
        width: 100%;
        height: 55vh;
        min-height: 420px;
      }

      .portrait {
        right: 0;
        width: 100%;
        height: 100%;
      }

      .scroll-hint,
      .year {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .sig {
        stroke-dashoffset: 0 !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="frame">
    <header class="header">
      <div class="logo">QQ.SG</div>
      <nav class="nav">
        <a class="active" href="#">Home</a>
        <a href="#">Works</a>
        <a href="#">Notes</a>
        <a href="#">About</a>
      </nav>
    </header>

    <section class="left">
      <div class="left-inner">
        <div class="eyebrow">Kaixiang Nie · Personal Portfolio</div>

        <svg class="signature" viewBox="0 0 720 285" role="img" aria-label="Kaixiang Nie signature">
          <path class="sig" pathLength="1" d="M87 252 C105 220 125 182 145 142 C162 108 175 82 184 64"/>
          <path class="sig" pathLength="1" d="M108 213 C143 184 188 155 260 111"/>
          <path class="sig" pathLength="1" d="M108 213 C129 207 147 213 164 227 C181 242 198 252 223 258"/>
          <path class="sig" pathLength="1" d="M188 226 C197 210 208 202 219 202 C229 202 233 210 228 218 C223 226 211 230 203 226 C196 222 198 214 205 209 C214 202 223 207 231 217 C237 224 244 225 251 220 C258 215 262 204 268 197 C264 207 261 217 263 223 C265 229 271 229 278 223 C285 217 291 207 298 199 C304 193 309 195 307 202 C305 211 297 220 295 225 C294 230 300 230 307 224 C315 217 323 206 331 200 C338 195 344 196 342 203 C340 211 333 218 329 223 C336 218 345 207 354 202 C362 198 368 201 366 208 C363 216 356 223 352 227 C360 221 369 209 378 204 C386 200 392 202 390 210 C387 219 380 225 377 229 C385 223 394 211 403 207 C410 203 416 206 415 212 C413 221 406 227 400 230 C393 233 387 230 388 224 C390 217 398 212 406 214 C414 216 419 226 416 237 C412 251 403 263 392 271 C381 278 373 275 375 267 C378 254 391 242 406 233 C421 225 438 217 456 212"/>
          <path class="sig" pathLength="1" d="M247 185 L249 181"/>
          <path class="sig" pathLength="1" d="M307 184 L309 180"/>
          <path class="sig" pathLength="1" d="M442 231 C458 198 477 158 498 122 L490 263 L562 91"/>
          <path class="sig" pathLength="1" d="M519 226 C527 216 533 203 538 194 C541 188 544 190 542 197 C539 206 535 216 537 221 C539 225 545 223 551 217 C557 211 564 205 570 204 C576 203 579 207 577 213 C574 220 567 224 560 222 C554 220 555 213 561 209 C568 205 576 209 582 214 C588 219 595 220 603 217 C611 214 618 208 625 205 C632 202 639 205 639 211 C639 217 633 221 626 220 C619 219 619 212 625 209 C633 205 641 210 650 213 C662 217 675 214 691 207"/>
          <path class="sig" pathLength="1" d="M538 175 L540 171"/>
        </svg>

        <div class="qq">QQ.SG</div>

        <div class="subcopy">
          Projects / Infrastructure<br />
          Notes / Life / Archive
        </div>

        <div class="desc">
          A minimal home for projects, notes, and whatever feels worth keeping.
        </div>

        <div class="actions">
          <button class="btn primary" type="button">Enter</button>
          <button class="btn" id="replayBtn" type="button">Replay Signature</button>
        </div>
      </div>
    </section>

    <section class="portrait-wrap" aria-label="three-quarter black and white portrait">
      <img class="portrait" src="portrait.png" alt="Portrait" />
      <div class="left-fade"></div>
      <div class="shape-balance"></div>
      <div class="face-fix"></div>
    </section>

    <div class="white-glow"></div>

    <div class="scroll-hint">Scroll</div>
    <div class="year">Kaixiang Nie · 2026</div>
  </main>

  <script>
    (() => {
      const paths = [...document.querySelectorAll(".sig")];
      const replayBtn = document.getElementById("replayBtn");
      let runId = 0;

      const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

      async function playSignature() {
        const myId = ++runId;

        paths.forEach((p) => {
          p.style.transition = "none";
          p.style.strokeDashoffset = "1";
        });

        await wait(160);

        for (const p of paths) {
          if (myId !== runId) return;

          const len = p.getTotalLength();
          const tiny = len < 10;
          const ms = tiny ? 90 : Math.max(240, Math.min(1150, len * 2.65));

          p.style.transition = "none";
          p.style.strokeDashoffset = "1";
          p.getBoundingClientRect();
          p.style.transition = `stroke-dashoffset ${ms}ms cubic-bezier(.25,.03,.16,1)`;
          p.style.strokeDashoffset = "0";

          await wait(ms + (tiny ? 40 : 68));
        }
      }

      replayBtn.addEventListener("click", playSignature);
      playSignature();
    })();
  </script>
</body>
</html>
