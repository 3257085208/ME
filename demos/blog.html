<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>聶.NET</title>
<style>
:root{--bg:#fff;--text:#50616d;--sub:#9aa5b1;--accent:#42b983;--border:#f0f2f5;--tag:#f8fafc;--soft:#f7f9fa;--drawer-mask:rgba(20,28,38,.26)}
html[data-theme="dark"]{--bg:#1a202c;--text:#e2e8f0;--sub:#a0aec0;--accent:#68d391;--border:#2d3748;--tag:#2d3748;--soft:#222b36;--drawer-mask:rgba(0,0,0,.45)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;touch-action:pan-y;overscroll-behavior-y:auto}
body{background:var(--bg);color:var(--text);font-family:"Nunito","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;line-height:1.6;transition:background .3s ease,color .3s ease}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(rgba(128,128,128,.055) 1px,transparent 1px);background-size:22px 22px;opacity:.5}
.page{position:relative;width:min(1040px,calc(100% - 76px));height:100%;margin:auto;padding:18px 0 20px;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:18px;min-height:64px;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:11px;flex:none}
.avatar{width:44px;height:44px;border-radius:50%;border:2px solid var(--border);object-fit:cover;background:var(--tag)}
.site-title{color:var(--accent);font-size:22px;font-weight:900;letter-spacing:-.03em;white-space:nowrap}
nav{display:flex;align-items:center;gap:15px;margin-left:12px;font-size:13px;font-weight:800;white-space:nowrap}
nav button{color:var(--text);padding:4px 0;border:0;background:none;font:inherit;cursor:pointer}
nav button:hover,nav button.active{color:var(--accent)}
.theme{margin-left:auto;border:0;background:none;color:#f0ad4e;font-size:18px;line-height:1;padding:5px;cursor:pointer}
.intro{padding:10px 0 9px}
.signature{margin:0;font-size:25px;font-weight:900;letter-spacing:-.03em;color:var(--text)}
.signature i{color:var(--accent);font-style:normal;animation:caret 1.2s steps(2) infinite}
@keyframes caret{50%{opacity:0}}
.contact{display:flex;align-items:center;gap:10px;margin-top:8px;color:var(--sub);font-size:11px;font-weight:800}
.contact a{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:var(--tag);color:var(--sub);text-decoration:none;border:0}
.contact svg{width:12px;height:12px;fill:currentColor}
.contact a:hover{background:var(--accent);color:#fff}
main{display:flex;flex-direction:column;min-height:0;flex:1}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-bottom:8px}
.head h1{font-size:27px;line-height:1.1;margin:0;color:var(--accent);letter-spacing:-.03em}
.tools{display:flex;align-items:center;gap:9px;margin:4px 0 9px}
.search{display:flex;align-items:center;gap:8px;flex:1;border:1px solid var(--border);border-radius:12px;background:var(--bg);padding:8px 12px;min-height:38px;color:var(--sub)}
.search svg{width:13px;height:13px;flex:none;fill:none;stroke:currentColor;stroke-width:2}
.search input{border:0;outline:0;background:none;width:100%;color:var(--text);font:700 13px/1.4 inherit}
.search input::placeholder{color:var(--sub)}
.pager{display:flex;align-items:center;gap:7px;color:var(--sub);font-size:11px;font-weight:800;white-space:nowrap}
.pager button{height:29px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--sub);padding:0 9px;font:700 10px/1 inherit;cursor:pointer}
.pager button:hover{border-color:var(--accent);color:var(--accent)}
.filter-hint{display:flex;align-items:center;gap:5px;margin-left:4px;color:var(--accent);font-size:11px;white-space:nowrap}
.filter-hint[hidden]{display:none}
.filter-hint button{border:0;background:none;color:var(--sub);font-size:14px;cursor:pointer}
.feed{flex:1;min-height:0;overflow:hidden}
.post{display:block;padding:9px 0;border-bottom:1px dashed var(--border)}
.post[hidden]{display:none}
.post-meta{display:flex;align-items:center;gap:8px;color:var(--sub);font-size:11px;font-weight:700}
.pin{display:inline-flex;align-items:center;border:1px solid #fecaca;background:#fff1f2;color:#ef4444;border-radius:5px;padding:1px 5px;font-size:10px;font-weight:800;line-height:1.4}
.post-title-line{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0 5px}.post-title{display:inline;margin:0;font-size:15px;font-weight:900;color:var(--text);letter-spacing:-.01em;line-height:1.4;border:0;background:none;text-align:left;padding:0;cursor:pointer}
.post-title:hover{color:var(--accent)}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
.tag{border:0;background:var(--tag);color:var(--sub);border-radius:20px;padding:2px 8px;font:700 10px/1.35 inherit;cursor:pointer}
.tag:hover{color:var(--accent)}
.empty{color:var(--sub);font-size:13px;padding:22px 0}
.floats{position:fixed;right:22px;bottom:22px;display:flex;flex-direction:column;gap:8px}
.float{width:38px;height:38px;border:1px solid var(--border);border-radius:50%;background:var(--bg);color:var(--sub);box-shadow:0 4px 12px rgba(0,0,0,.035);cursor:pointer;display:grid;place-items:center;font-size:16px;line-height:1}
.float[data-kind="home"]{border-color:var(--accent);color:var(--accent)}
.drawer-mask{position:fixed;inset:0;background:var(--drawer-mask);opacity:0;pointer-events:none;transition:.3s;z-index:9}
.drawer-mask.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:21;top:70px;right:0;width:min(440px,80vw);height:calc(100% - 70px);background:var(--bg);border-left:1px solid var(--border);box-shadow:-12px 0 40px rgba(0,0,0,.12);transform:translateX(102%);transition:.35s cubic-bezier(.2,.8,.2,1);padding:26px 28px;overflow:hidden}
.drawer.show{transform:none}
.drawer h2{font-size:22px;line-height:1.3;color:var(--text);margin:16px 0 8px}
.drawer-meta{font-size:11px;color:var(--sub);font-weight:800}
.drawer p{font-size:14px;line-height:1.8;color:var(--text)}
.close{position:absolute;right:18px;top:16px;border:0;background:var(--tag);width:29px;height:29px;border-radius:50%;color:var(--text);cursor:pointer;font-size:16px}
@media(max-width:900px){
 .page{width:calc(100% - 28px);padding:9px 0 11px}
 header{min-height:50px;padding-bottom:6px;gap:9px}
 .avatar{width:34px;height:34px}.site-title{font-size:18px}nav{display:none}.theme{font-size:17px}
 .intro{padding:7px 0 5px}.signature{font-size:17px}.contact{margin-top:5px;gap:6px;font-size:10px}.contact a{width:22px;height:22px}.contact svg{width:11px;height:11px}
 .head{padding-bottom:5px}.head h1{font-size:20px}.tools{gap:6px;margin:2px 0 4px}.search{min-height:33px;padding:5px 8px;font-size:11px}.search input{font-size:11px}.pager{font-size:10px;gap:4px}.pager button{height:25px;padding:0 6px;font-size:10px}.filter-hint{font-size:10px}
 .post{padding:7px 0}.post-meta{font-size:10px}.post-title{font-size:12px;margin:2px 0 3px}.tag{font-size:10px;padding:1px 6px}
 .post:nth-child(n+5){display:none!important}.floats{display:none}.drawer{top:58px;height:calc(100% - 58px);width:100%;padding:20px}
}
@media(max-height:820px){.post:nth-child(n+6){display:none!important}}
</style>
</head>

<script>
(()=>{
const posts=[...document.querySelectorAll('.post')],search=document.getElementById('search'),pageInfo=document.getElementById('pageInfo'),hint=document.getElementById('filterHint'),hintText=document.getElementById('filterText'),empty=document.getElementById('empty');
let activeTag='';
function apply(){const q=search.value.trim().toLowerCase();let n=0;posts.forEach(p=>{const tags=(p.dataset.tags||'').split(' ');const ok=(!activeTag||tags.includes(activeTag))&&(!q||(p.dataset.search||'').toLowerCase().includes(q));p.hidden=!ok;if(ok)n++});pageInfo.textContent=activeTag||q?'1/1 · '+n+'篇':'1/4 · 39篇';empty.hidden=n>0;hint.hidden=!activeTag;hintText.textContent=activeTag?'#'+activeTag:'';}
search.addEventListener('input',apply);document.getElementById('clearFilter').addEventListener('click',()=>{activeTag='';apply()});
document.querySelectorAll('.tag').forEach(t=>t.addEventListener('click',()=>{activeTag=t.textContent.replace('#','');apply()}));
const drawer=document.getElementById('drawer'),mask=document.getElementById('mask');
const navButtons=[...document.querySelectorAll('[data-nav]')];
function setActive(name){navButtons.forEach(b=>b.classList.toggle('active',b.dataset.nav===name))}
function openInfo(title,body){document.getElementById('drawerTitle').textContent=title;document.getElementById('drawerMeta').textContent='聶.NET · QUICK VIEW';document.getElementById('drawerBody').innerHTML=body.split('|').map(x=>'<p>'+x+'</p>').join('');drawer.classList.add('show');mask.classList.add('show');drawer.setAttribute('aria-hidden','false')}
function closeDrawer(){drawer.classList.remove('show');mask.classList.remove('show');drawer.setAttribute('aria-hidden','true')}
const navContent={notes:['动态','最近更新于 2026.09.26。|搜索框与标签筛选会实时作用于文章列表。'],categories:['分类','#博客 · 2 篇|#静态站点 · 1 篇|#域名 · 1 篇|#折腾 · 1 篇|#回忆 · 1 篇'],archive:['归档','2026.09.26 · 纯客户端复刻移动 App 协议|2026.03.27 · 长夜翻旧梦，方知我才十八载|2026.02.08 · niekaixiang.com：现在它和聶.NET一样'],friends:['友链','LowEnd.Cloud · 算力按月，价格写在明处|1KB.Page · 一个 1,024 字节的网站实验|NIE-SLA · 41 个服务的实时状态'],guestbook:['留言','这里是一块安静的留言板。|演示页面不连接后端，留言请前往真实站点。'],about:['关于','聶.NET，花有重开日，人无再少年。|使用 Higan 静态博客系统构建，记录网络、代码与生活。'],rss:['RSS','订阅地址：https://www.niekaixiang.com/rss.xml|RSS 是内容的开放出口。']};
navButtons.forEach(b=>b.addEventListener('click',()=>{const name=b.dataset.nav;setActive(name);if(name==='home'){closeDrawer();search.value='';activeTag='';apply();return}const c=navContent[name];if(c)openInfo(c[0],c[1])}));
document.querySelectorAll('[data-contact]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();const map={mail:['邮件','hello@niekaixiang.com|真实站点使用邮件表单。'],qq:['QQ','QQ 是演示入口，不展示真实号码。|请通过真实站点联系。'],telegram:['Telegram','Telegram 交流入口。|演示页面不连接外部服务。'],wechat:['微信','微信联系方式在真实站点保留。|这里只是展示入口。'],github:['GitHub','github.com/3257085208|真实仓库入口。']};const c=map[a.dataset.contact];if(c)openInfo(c[0],c[1])}));
posts.forEach(p=>{const title=p.querySelector('.post-title');title.addEventListener('click',()=>openInfo(title.dataset.title,title.dataset.body))});
mask.addEventListener('click',closeDrawer);document.getElementById('closeDrawer').addEventListener('click',closeDrawer);
function toggleTheme(){const dark=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dark?'light':'dark';document.getElementById('themeBtn').textContent=dark?'☀':'☾'}
document.getElementById('themeBtn').addEventListener('click',toggleTheme);document.getElementById('floatMore').addEventListener('click',toggleTheme);
function resetAll(){closeDrawer();search.value='';activeTag='';apply();setActive('home')}
document.getElementById('floatHome').addEventListener('click',resetAll);document.getElementById('floatReset').addEventListener('click',resetAll);
apply();
const targetOrigin=location.origin==='null'?'*':location.origin;
const send=(dy,dx=0,mode=0)=>parent.postMessage({type:'demo-scroll',kind:'wheel',dy,dx,mode},targetOrigin);
addEventListener('wheel',e=>{e.preventDefault();send(e.deltaY,e.deltaX,e.deltaMode)},{passive:false});
})();
</script>
